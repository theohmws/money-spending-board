name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        node-version: [16.x]

    name: Create a new release
    runs-on: ubuntu-latest
    # Without this, GITHUB_TOKEN is read-only by default (per this repo's
    # Actions settings) and semantic-release's git push (the version
    # bump/tag) and its GitHub Release/issue creation both fail with a 403.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: HUSKY=0 npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
