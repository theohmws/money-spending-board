<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Money Spending Board</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef1f0;
        color: #132119;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin: 0 auto 1.25rem;
        display: block;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }

      p {
        margin: 0;
        color: #7a857d;
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>
        Money Spending Board needs a connection to load your data. Reconnect
        and reload to keep tracking your spending.
      </p>
    </main>
  </body>
</html>
