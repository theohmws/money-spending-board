<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fdfcf8;
        --ink: #1f2a1f;
        --muted: #5b6658;
        --accent: #2f6b2f;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: var(--font-display); color: var(--ink); }
      .fill { position: absolute; inset: 0; }
      #shot { width: 1920px; height: 1080px; object-fit: cover; transform-origin: 50% 55%; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      h1 { font-size: 112px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.02; }
      .eyebrow { font-size: 30px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
      .sub { font-size: 40px; font-weight: 400; color: var(--muted); margin-top: 28px; }
      .pill { display: inline-block; font-size: 30px; font-weight: 700; color: var(--accent); background: #e6efe1; border-radius: 999px; padding: 14px 30px; margin-bottom: 36px; }
      .big { font-size: 128px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.0; }
      .desc { font-size: 40px; color: var(--muted); margin-top: 32px; max-width: 1200px; line-height: 1.35; }
      #end-mark { width: 200px; height: 200px; }
      #wordmark { font-size: 96px; font-weight: 900; letter-spacing: -0.03em; margin-top: 36px; }
      #cmd { font-family: "JetBrains Mono", monospace; font-size: 46px; background: var(--ink); color: #fdfcf8; border-radius: 18px; padding: 26px 48px; margin-top: 48px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="41.5" data-width="1920" data-height="1080">

      <!-- 0–3.5 s: hook -->
      <div id="hook" class="clip fill center" data-start="0" data-duration="3.6" data-track-index="1" style="z-index:1">
        <div class="eyebrow" id="hook-eyebrow">Money Spending Board</div>
        <h1 id="hook-title" style="margin-top:24px">Every baht you spend,<br />in one place.</h1>
      </div>

      <!-- 3.5–9.5 s: the real landing page, pushing into the feature grid -->
      <div id="shot-wrap" class="clip fill" data-start="3.5" data-duration="6" data-track-index="2" style="z-index:2; overflow:hidden">
        <img id="shot" class="clip" src="assets/landing-en.png" alt="Money Spending Board landing page" />
      </div>

      <!-- 9.5–37.3 s: real recording of the board (sample data, 2x speed) -->
      <video id="flow" class="clip fill" src="assets/board-flow.mp4" muted playsinline data-start="9.5" data-duration="27.77" data-track-index="3" style="z-index:3; width:1920px; height:1080px; object-fit:cover; opacity:0"></video>

      <!-- 37.5–41.5 s: end card, real icon and the real dev command -->
      <div id="end" class="clip fill center" data-start="37.5" data-duration="4" data-track-index="4" style="z-index:4">
        <img id="end-mark" class="clip" src="assets/icon.svg" alt="" />
        <div id="wordmark">Money Spending Board</div>
        <div id="cmd">npm install &amp;&amp; npm run dev</div>
      </div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Hook
      tl.fromTo("#hook-eyebrow", { y: 20 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#hook-title", { y: 40, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, 0.1);
      tl.to("#hook", { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.25);

      // Landing page: fade in, then push toward the feature grid
      tl.fromTo("#shot", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 3.5);
      tl.to("#shot", { scale: 1.32, duration: 5, ease: "power1.inOut" }, 4.1);
      tl.to("#shot-wrap", { opacity: 0, duration: 0.4, ease: "power2.in" }, 9.1);

      // Real board recording: cross-fade in from the landing page
      tl.to("#flow", { opacity: 1, duration: 0.4, ease: "power2.out" }, 9.5);

      // End card
      tl.fromTo("#end-mark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 37.6);
      tl.fromTo("#wordmark", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 38.0);
      tl.fromTo("#cmd", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 38.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
